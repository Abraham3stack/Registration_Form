<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <header>
    
  </header>

  <main>
    <section>
      <section class="form-section">
        <h2>Form Registration</h2>
      </section>
      <form>
        <label for="Fullname">Fullname:</label>
        <input type="text" name="Fullname" placeholder="e.g Abraham Ogbu" required>

        <label for="Email">Email:</label>
        <input type="email" name="Email" placeholder="abraham@gmail.com">

        <label for="address">Contact Address:</label>
        <input type="text" name="Address" placeholder="23 lagos street, abuja">

        <label for="DOB">Select Date of Birth:</label>
        <input type="date" name="DOB">

        <label for="gender"> Select Gender:</label>
        <select>
          <option value="select">Select</option>
          <option value="select">Male</option>
          <option value="select">Female</option>
        </select>

        
      </form>
      <section class="submit-section">
        <button type="submit" value="submit">Submit</button>
      </section>
    </section>
  </main>
</body>
</html>
